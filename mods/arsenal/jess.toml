manifest_version = 1

[package]
id = "org.dreamweave.doom.arsenal"
version = "1.0.0"
jess_api = "1"
include = ["src", "tests"]
tests = ["tests/arsenal_test.jsl"]

[dependencies]
"org.dreamweave.doom" = "^0.1"

[modules]
"@arsenal" = "src/arsenal.jsl"

[[layer]]
id = "org.dreamweave.doom.arsenal"
exports = ["@arsenal"]

[managed.mod]
module = "src/managed.jsl"
interface = "doom.mods"
