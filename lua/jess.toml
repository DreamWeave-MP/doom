manifest_version = 1

[package]
id = "org.dreamweave.doom"
version = "0.1.0"
jess_api = "1"
include = ["src", "bin", "README.md", "LICENSE.TXT"]
tests = ["tests/wad_test.luau", "tests/net_test.luau", "tests/play_test.luau"]

[modules]
"@doom/fixed" = "src/fixed.luau"
"@doom/random" = "src/random.luau"
"@doom/angle" = "src/angle.luau"
"@doom/tables" = "src/tables.luau"
"@doom/wad" = "src/wad.luau"
"@doom/palette" = "src/palette.luau"
"@doom/patch" = "src/patch.luau"
"@doom/map" = "src/map.luau"
"@doom/render" = "src/render.luau"
"@doom/texture" = "src/texture.luau"
"@doom/demo" = "src/demo.luau"
"@doom/state" = "src/state.luau"
"@doom/save" = "src/save.luau"
"@doom/net" = "src/net.luau"
"@doom/netgame" = "src/netgame.luau"
"@doom/rthings" = "src/rthings.luau"
"@doom/play" = "src/play/api.luau"
"@doom/agent" = "src/agent.luau"
"@doom" = "src/init.luau"

[[layer]]
id = "org.dreamweave.doom.runtime"
exports = [
  "@doom/fixed",
  "@doom/random",
  "@doom/angle",
  "@doom/tables",
  "@doom/wad",
  "@doom/palette",
  "@doom/patch",
  "@doom/map",
  "@doom/render",
  "@doom/texture",
  "@doom/demo",
  "@doom/state",
  "@doom/save",
  "@doom/net",
  "@doom/netgame",
  "@doom/rthings",
  "@doom/play",
  "@doom/agent",
  "@doom",
]

[[layer.entrypoint]]
module = "@doom/net"
capabilities = ["network.transport"]
