manifest_version = 1

[package]
id = "org.dreamweave.doom"
version = "0.1.0"
jess_api = "1"
include = ["src", "bin", "README.md", "LICENSE.TXT"]
tests = ["tests/wad_test.jsl", "tests/net_test.jsl", "tests/play_test.jsl"]

[modules]
"@doom/fixed" = "src/fixed.jsl"
"@doom/random" = "src/random.jsl"
"@doom/angle" = "src/angle.jsl"
"@doom/tables" = "src/tables.jsl"
"@doom/wad" = "src/wad.jsl"
"@doom/palette" = "src/palette.jsl"
"@doom/patch" = "src/patch.jsl"
"@doom/map" = "src/map.jsl"
"@doom/render" = "src/render.jsl"
"@doom/texture" = "src/texture.jsl"
"@doom/demo" = "src/demo.jsl"
"@doom/state" = "src/state.jsl"
"@doom/save" = "src/save.jsl"
"@doom/net" = "src/net.jsl"
"@doom/netgame" = "src/netgame.jsl"
"@doom/rthings" = "src/rthings.jsl"
"@doom/play" = "src/play/api.jsl"
"@doom/agent" = "src/agent.jsl"
"@doom" = "src/init.jsl"

[[layer]]
id = "org.dreamweave.doom.runtime"
exports = [
  "@doom/fixed",
  "@doom/random",
  "@doom/angle",
  "@doom/tables",
  "@doom/wad",
  "@doom/palette",
  "@doom/patch",
  "@doom/map",
  "@doom/render",
  "@doom/texture",
  "@doom/demo",
  "@doom/state",
  "@doom/save",
  "@doom/net",
  "@doom/netgame",
  "@doom/rthings",
  "@doom/play",
  "@doom/agent",
  "@doom",
]

[[layer.entrypoint]]
module = "@doom/net"
capabilities = ["network.transport"]
