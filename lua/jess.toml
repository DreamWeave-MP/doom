manifest_version = 1

[package]
id = "org.dreamweave.doom"
version = "0.1.0"
jess_api = "1"
include = ["src", "bin", "tests", "README.md", "LICENSE.TXT"]
tests = ["tests/wad_test.jsl", "tests/net_test.jsl", "tests/play_test.jsl", "tests/rules_test.jsl", "tests/hud_test.jsl", "tests/screens_test.jsl", "tests/sound_test.jsl", "tests/view_test.jsl"]

[modules]
"@doom/fixed" = "src/fixed.jsl"
"@doom/random" = "src/random.jsl"
"@doom/angle" = "src/angle.jsl"
"@doom/tables" = "src/tables.jsl"
"@doom/wad" = "src/wad.jsl"
"@doom/palette" = "src/palette.jsl"
"@doom/patch" = "src/patch.jsl"
"@doom/map" = "src/map.jsl"
"@doom/render" = "src/render.jsl"
"@doom/texture" = "src/texture.jsl"
"@doom/demo" = "src/demo.jsl"
"@doom/state" = "src/state.jsl"
"@doom/save" = "src/save.jsl"
"@doom/net" = "src/net.jsl"
"@doom/content" = "src/content.jsl"
"@doom/session" = "src/session/init.jsl"
"@doom/play" = "src/play/api.jsl"
"@doom/agent" = "src/agent.jsl"
"@doom/view" = "src/view/init.jsl"
"@doom/spectator" = "src/spectator.jsl"
"@doom/mod" = "src/mod/init.jsl"
"@doom/rules" = "src/rules/init.jsl"
"@doom/setup" = "src/setup.jsl"
"@doom/hud" = "src/hud/init.jsl"
"@doom/screens" = "src/screens.jsl"
"@doom/sound" = "src/sound/init.jsl"
"@doom" = "src/init.jsl"

[[layer]]
id = "org.dreamweave.doom.runtime"
exports = [
  "@doom/fixed",
  "@doom/random",
  "@doom/angle",
  "@doom/tables",
  "@doom/wad",
  "@doom/palette",
  "@doom/patch",
  "@doom/map",
  "@doom/render",
  "@doom/texture",
  "@doom/demo",
  "@doom/state",
  "@doom/save",
  "@doom/net",
  "@doom/content",
  "@doom/session",
  "@doom/play",
  "@doom/agent",
  "@doom/view",
  "@doom/spectator",
  "@doom/mod",
  "@doom/rules",
  "@doom/setup",
  "@doom/hud",
  "@doom/screens",
  "@doom/sound",
  "@doom",
]

[[layer.entrypoint]]
module = "@doom/net"
capabilities = ["network.transport"]

[managed.game]
module = "src/app/main.jsl"

[targets.doom]
kind = "application"
entry = "src/app/entry.jsl"
capabilities = [
  "gpu.device",
  "gpu.window",
  "input.actions",
  "input.configure",
  "audio.output",
  "network.transport",
  "filesystem.read",
  "filesystem.write",
]
