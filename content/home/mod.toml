# DOOM for Jess as a DreamWeave project: a Jess package. `jess` names the Package Source it
# publishes, the jess.toml at `lua/`, and each release tag `doom-<version>` is one
# version of the package, packed by the Mod Template from that tag; every push packs a
# development build.
id = "70f3f079-226d-48ac-be5a-73fb327eb7c0"
slug = "doom"
type = "library"
status = "active"

[[maintainers]]
name = "DreamWeave"
url = "https://github.com/DreamWeave-MP"

[package]
format = "jpk"
jess = "org.dreamweave.doom"
source = "lua"

[[releases]]
version = "0.1.0"
date = 2026-10-21
summary = "First release published as a DreamWeave project."
